version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: caloright-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: caloright
      POSTGRES_PASSWORD: caloright
      POSTGRES_DB: caloright
    volumes:
      - caloright_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caloright"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  caloright_pgdata:
